name: Build LinkBridge Ready-to-Run EXE and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Run Automated Protocol & Integration Verification Tests
        run: |
          python -u tests/test_linkbridge_suite.py

      - name: Build single-file standalone LinkBridge-Windows.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "LinkBridge-Windows" --paths "." windows/app.py

      - name: Upload LinkBridge-Windows.exe
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-Windows-EXE
          path: dist/LinkBridge-Windows.exe
          if-no-files-found: error

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK Platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.5 (Compatible with AGP 8.2.2 & Kotlin 1.9.22)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5.zip
          unzip -q /tmp/gradle-8.5.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Android 9+ Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload LinkBridge-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
